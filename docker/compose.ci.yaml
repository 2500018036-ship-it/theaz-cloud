services:
  app:
    environment:
      app_baseURL: ${CI_BASE_URL:-http://127.0.0.1:18080/}
      cookie_secure: "false"
  web:
    ports: !override ["127.0.0.1:${LOCAL_HTTP_PORT:-18080}:80"]
    networks: !override [backend, ci_frontend]
  tests:
    image: cloud-storage-test:${RELEASE_SHA}
    build:
      context: ${RELEASE_PATH}
      dockerfile: docker/php/Dockerfile
      target: test
    environment:
      CI_ENVIRONMENT: testing
      database_tests_hostname: db
      database_tests_database: cloud_storage_tests
      database_tests_username: ${MARIADB_USER}
      database_tests_password: ${MARIADB_PASSWORD}
      database_tests_DBDriver: MySQLi
      database_tests_DBPrefix: dbtests_
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
networks:
  ci_frontend: {}
