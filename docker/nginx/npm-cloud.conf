client_max_body_size 121g;
proxy_request_buffering off;
set $cloud_original_scheme $scheme;
if ($realip_remote_addr = "10.10.0.1") {
    set $cloud_original_scheme $x_forwarded_proto;
}
location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $cloud_original_scheme;
    proxy_set_header Front-End-Https "";
    proxy_connect_timeout 60s;
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;
    proxy_pass $forward_scheme://$server:$port$request_uri;
}
