geo $cloud_trusted_proxy {
    default 0;
    172.18.0.2/32 1;
}
map "$cloud_trusted_proxy:$http_x_forwarded_proto" $cloud_original_scheme {
    default $scheme;
    "1:https" https;
}
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;
    client_max_body_size 136m;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* ^/(?:assets|template)/.*\.(?:css|js|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /index.php {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $cloud_original_scheme;
        fastcgi_param HTTP_FRONT_END_HTTPS "";
        fastcgi_pass app:9000;
        fastcgi_read_timeout 300;
        fastcgi_buffering on;
    }

    location ~ \.php(?:/|$) { return 404; }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:log|env|ini|sql|bak|swp)$ {
        deny all;
    }
}
